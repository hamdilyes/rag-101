[project]
name = "rag-101-processing"
version = "0.1.0"
description = "Parallel document processing (parse, chunk, embed) for RAG-101"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",          # fast PDF parsing
    "sentence-transformers>=3.0",  # Qwen3-Embedding via ST
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "psutil>=5.9",            # RAM monitoring for resource limits
    "tqdm>=4.66",
]

[project.scripts]
rag-process = "rag_processing.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_processing"]
