# ============================================================================
#  Processing pipeline configuration
#  All resource limits live here. Tune these to your machine.
# ============================================================================

resources:
  # Number of parallel worker processes used for parse + chunk (CPU-bound).
  # "auto" -> min(cpu_count - 1, ram_budget). Set an integer to force it.
  max_workers: auto

  # Soft RAM ceiling for the whole pipeline, in GB. The orchestrator caps the
  # worker count so that (workers * per_worker_ram_gb) stays under this budget,
  # and pauses spawning new work when measured RSS approaches the limit.
  max_ram_gb: 2.0

  # Rough RAM cost of one parse/chunk worker. Used only to derive worker count.
  per_worker_ram_gb: 0.4

  # Batch size for the embedding stage (bigger = faster but more RAM/VRAM).
  embed_batch_size: 16

parsing:
  # Drop pages/blocks with fewer than this many characters (cover pages, etc.).
  min_chars: 50

chunking:
  # Target chunk size and overlap, measured in tokens of the embedding model's
  # tokenizer (falls back to ~4 chars/token if the tokenizer is unavailable).
  chunk_size: 512
  chunk_overlap: 64

embedding:
  model: Qwen/Qwen3-Embedding-0.6B
  device: auto          # auto | cpu | cuda
  normalize: true       # L2-normalize so cosine == dot product
  # Qwen3-Embedding wants an instruction prefix on the *document* side? No.
  # Documents are embedded plain; the query instruction is applied at query
  # time in the backend. See embed.py.

paths:
  corpus_dir: ../corpus
  output_dir: ../data/index
  # Local HF cache so re-runs don't re-download the model.
  hf_cache_dir: ../.hf_cache
