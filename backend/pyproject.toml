[project]
name = "rag-101-backend"
version = "0.1.0"
description = "FastAPI RAG server: retrieve, rerank, and stream answers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",   # query embedding (Qwen3-Embedding)
    "transformers>=4.44",           # reranker (Qwen3-Reranker)
    "torch>=2.2",
    "httpx>=0.27",                  # OpenAI-compatible LLM path
    "anthropic>=0.40",              # default LLM path (Claude)
]

[project.scripts]
rag-serve = "rag_backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_backend"]
